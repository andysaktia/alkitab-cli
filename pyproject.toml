[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alkitab-cli"
version = "0.1.0"
description = "Baca Alkitab Yang Terbuka (AYT) dari terminal: offline, cepat, nama kitab pintar. Proyek tidak resmi."
readme = "README.md"
requires-python = ">=3.9"
# Lisensi KODE. Teks AYT yang ikut terkemas punya ketentuan sendiri (lihat NOTICE.md).
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["alkitab", "bible", "indonesia", "cli", "ayt", "terminal"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Indonesian",
    "Programming Language :: Python :: 3",
    "Topic :: Religion",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alkitab = "alkitab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alkitab = ["data/ayt.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
